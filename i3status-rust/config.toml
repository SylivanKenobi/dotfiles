# vim: ts=2 sw=2 et ft=toml

icons_format = "{icon}"

[theme]
theme = "solarized-light"

[theme.overrides]
idle_bg = "#FFFFFF"
idle_fg = "#606160"
alternating_tint_fg ="#FFFFFF"


[icons]
icons = "awesome4"

[[block]]
block = "custom"
command = "[[ $(date +'%H') < 16 ]] && echo '{\"state\":\"Idle\", \"text\": \"🧉\"}' || echo '{\"state\":\"Idle\", \"text\": \"🍺\"}'"
interval = 10
json = true
[block.theme_overrides]
idle_bg = "#025217"

[[block]]
block = "cpu"

[[block]]
block = "disk_space"
path = "/"
info_type = "available"
alert_unit = "GB"
interval = 20
warning = 20.0
alert = 10.0
format = " $icon root: $available.eng(w:2) "
[block.theme_overrides]
idle_bg = "#025217"

[[block]]
block = "memory"
format = " $icon $mem_total_used_percents.eng(w:2) "
format_alt = " $icon_swap $swap_used_percents.eng(w:2) "

[[block]]
block = "sound"
[[block.click]]
button = "left"
cmd = "pavucontrol"
[block.theme_overrides]
idle_bg = "#025217"

[[block]]
  block = "net"
  device = "eno1"
  interval = 1

[[block]]
block = "time"
interval = 1
format = " $timestamp.datetime(f:'%a %d/%m/%y %T') "
timezone = "Europe/Zurich"
[block.theme_overrides]
idle_bg = "#025217"


