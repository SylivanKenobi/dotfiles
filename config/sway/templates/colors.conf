# ~/.config/sway/templates/colors.conf

# Define variables using Matugen placeholders
set $background {{colors.surface.default.hex}}
set $foreground {{colors.on_surface.default.hex}}
set $primary    {{colors.primary.default.hex}}
set $secondary  {{colors.secondary.default.hex}}
set $urgent     {{colors.error.default.hex}}

# You can add more specific colors if needed
set $text       {{colors.on_surface.default.hex}}
set $inactive   {{colors.surface_variant.default.hex}}