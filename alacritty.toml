
[[keyboard.bindings]]
action = "IncreaseFontSize"
key = "B"
mods = "Control"

[[keyboard.bindings]]
action = "DecreaseFontSize"
key = "N"
mods = "Control"

[[keyboard.bindings]]
action = "ResetFontSize"
key = "M"
mods = "Control"

[general]
live_config_reload = true
working_directory = "None"

[terminal]

[colors.bright]
black = "#928374"
blue = "#83a598"
cyan = "#8ec07c"
green = "#b8bb26"
magenta = "#d3869b"
red = "#fb4934"
white = "#ebdbb2"
yellow = "#fabd2f"

[colors.normal]
black = "#282828"
blue = "#458588"
cyan = "#689d6a"
green = "#98971a"
magenta = "#b16286"
red = "#cc241d"
white = "#a89984"
yellow = "#d79921"

[colors.primary]
background = "#171717"
foreground = "#FFFFFF"

[cursor.style]
shape = "Block"

[cursor.vi_mode_style]
shape = "Block"

[env]
TERM = "alacritty"

[font]
size = 12

[font.bold]
family = "CascadiaCode"
style = "bold"

[font.italic]
family = "CascadiaCode"
style = "italic"

[font.normal]
family = "CascadiaCode"
style = "regular"

[[hints.enabled]]
command = "firefox"
hyperlinks = true
post_processing = true
regex = "(ipfs:|ipns:|magnet:|mailto:|gemini:|gopher:|https:|http:|news:|file:|git:|ssh:|ftp:)[^\u0000-\u001F\u007F-<>\"\\s{-}\\^⟨⟩`]+"

[hints.enabled.binding]
key = "U"
mods = "Control|Shift"

[hints.enabled.mouse]
enabled = true
mods = "None"

[scrolling]
history = 100000
multiplier = 3

[terminal.shell]
args = ["--login"]
program = "/bin/zsh"

[window]
opacity = 0.8

[keyboard]
