
[colors.bright]
black = "#928374"
blue = "#83a598"
cyan = "#8ec07c"
green = "#b8bb26"
magenta = "#d3869b"
red = "#fb4934"
white = "#ebdbb2"
yellow = "#fabd2f"

[colors.normal]
black = "#282828"
blue = "#458588"
cyan = "#689d6a"
green = "#98971a"
magenta = "#b16286"
red = "#cc241d"
white = "#a89984"
yellow = "#d79921"

[colors.primary]
background = "#282828"
foreground = "#ebdbb2"

[cursor]
unfocused_hollow = true

[env]
TERM = "alacritty"

[font]
size = 10

[[keyboard.bindings]]
action = "IncreaseFontSize"
key = "B"
mods = "Command"

[[keyboard.bindings]]
action = "DecreaseFontSize"
key = "N"
mods = "Command"

[[keyboard.bindings]]
action = "ResetFontSize"
key = "M"
mods = "Command"

[scrolling]
history = 10000
multiplier = 3

[terminal.shell]
args = ["--login"]
program = "/bin/zsh"

[window]
opacity = 0.8

[general]
live_config_reload = true
working_directory = "None"

[terminal]
